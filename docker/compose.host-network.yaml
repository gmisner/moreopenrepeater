# The old layout: the core and the API on the host's network (docs/docker.md, The private network).
#
#   docker compose -f compose.yaml -f compose.host-network.yaml up -d
#
# For an install that still has an Asterisk or a DMR bridge on the host, which the core reaches on 127.0.0.1, until
# those are containers. It is the layout before the private network, and the way back if the private one does not
# suit a site. Set the loopback addresses in core.env as docs/allstar.md describes (MOREOPENREPEATER_USRP_NODE and so
# on); the container-network addresses this replaces are only reachable from inside it.
services:
  core:
    network_mode: host
    networks: !reset []
    # The host's network has no `piper` name to find, so Piper is back inside the core, as it was.
    build:
      args:
        WITH_PIPER: "1"
    environment:
      PIPER_SERVICE_URL: http://127.0.0.1:8766
      PIPER_SERVICE_EXTERNAL: "0"
      PIPER_DATA_DIR: /opt/piper
      MOREOPENREPEATER_USRP_LISTEN: 127.0.0.1:34001
      MOREOPENREPEATER_USRP_ADDRESS: 127.0.0.1
      MOREOPENREPEATER_AUDIOSOCKET_LISTEN: 127.0.0.1:9092
      MOREOPENREPEATER_AUDIOSOCKET_ADDRESS: 127.0.0.1:9092

  # Not used in this layout (the core has its own Piper again), so it is not started.
  piper:
    profiles: !override ["host-layout-unused"]

  api:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      MOREOPENREPEATER_HOST: ${MOR_API_HOST:-127.0.0.1}
      MOREOPENREPEATER_PORT: ${MOR_API_PORT:-8000}
      MOREOPENREPEATER_USRP_LISTEN: 127.0.0.1:34001
      MOREOPENREPEATER_USRP_ADDRESS: 127.0.0.1
      MOREOPENREPEATER_AUDIOSOCKET_LISTEN: 127.0.0.1:9092
      MOREOPENREPEATER_AUDIOSOCKET_ADDRESS: 127.0.0.1:9092
