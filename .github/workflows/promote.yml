name: promote

# Moves a release channel forward: main -> beta, beta -> stable (see "Updates" in
# docs/raspberry-pi.md), or main -> docker. Only a commit whose tests passed can be
# promoted, and only as a fast-forward, so a channel never jumps backwards.
#
# docker is the channel for the container install, which is not yet what beta and stable carry (native installs follow
# those two). It moves on its own, from main, and is always a commit that is already on main, so there is no second line of
# code to keep in step. When native installs are ready for the same code, beta and stable are promoted to it.
# Promoting to stable also publishes a GitHub release with notes from the
# pull requests merged since the last one.
#
# The container images (images.yml, "Prebuilt images" in docs/docker.md) are published before the channel moves, in three
# jobs: check the commit, publish its images, then move the channel. So a channel never points at a commit that has no
# images, and if the images fail nothing has moved: run it again. Beta builds the images and tags them beta. Stable finds
# them already built (what ran on beta) and only adds the stable and release tags.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to move forward
        type: choice
        options: [beta, stable, docker]
        required: true
      commit:
        description: Commit to promote (default the newest on main for beta and docker, on beta for stable)
        required: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      before: ${{ steps.check.outputs.before }}
      release: ${{ steps.check.outputs.release }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$CHANNEL" = stable ]; then source=beta; else source=main; fi
          sha="$(git rev-parse --verify "${COMMIT:-origin/$source}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" "origin/$source"; then
            echo "::error::$sha isn't on $source; promote to beta first."
            exit 1
          fi
          passed="$(gh run list --workflow tests.yml --commit "$sha" --status success --limit 1 --json databaseId --jq length)"
          if [ "$passed" != 1 ]; then
            echo "::error::The tests haven't passed on $sha."
            exit 1
          fi
          before="$(git rev-parse --verify -q "origin/$CHANNEL" || echo none)"
          # Each stable release also gets a GitHub release, tagged by date. The images get the same tag.
          release=""
          if [ "$CHANNEL" = stable ] && [ "$before" != "$sha" ]; then
            base="v$(date -u +%Y.%m.%d)"
            release="$base"
            n=2
            while git ls-remote --exit-code --tags origin "refs/tags/$release" >/dev/null; do
              release="$base.$n"
              n=$((n + 1))
            done
          fi
          {
            echo "sha=$sha"
            echo "before=$before"
            echo "release=$release"
            echo "tags=$CHANNEL${release:+,$release}"
          } >>"$GITHUB_OUTPUT"

  images:
    needs: check
    uses: ./.github/workflows/images.yml
    # The most this workflow's jobs may use: images.yml asks for packages: write where it pushes.
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      commit: ${{ needs.check.outputs.sha }}
      tags: ${{ needs.check.outputs.tags }}

  move:
    needs: [check, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          SHA: ${{ needs.check.outputs.sha }}
          BEFORE: ${{ needs.check.outputs.before }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          # A fast-forward only: this fails, and moves nothing, if the channel has moved on since the check.
          git push origin "$SHA:refs/heads/$CHANNEL"
          {
            echo "### $CHANNEL is now $(git log -1 --format='%h %s' "$SHA")"
            if [ "$BEFORE" != none ]; then
              echo
              echo "New on $CHANNEL:"
              git log --format='- %h %s' "$BEFORE..$SHA"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$RELEASE" ]; then
            gh release create "$RELEASE" --target "$SHA" --title "$RELEASE" --generate-notes --latest
            echo "Released as [$RELEASE]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE)." >>"$GITHUB_STEP_SUMMARY"
          fi
