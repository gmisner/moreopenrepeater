name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # PortAudio backs `sounddevice`; espeak-ng lets the text-to-speech
      # tests exercise a real engine instead of skipping.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 espeak-ng
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
