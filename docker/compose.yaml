# The core and the dashboard/API as two containers (docs/docker.md). Run from this folder:
#
#   cp .env.example .env              # host paths and devices (optional)
#   docker compose up -d --build
#   docker compose exec core python -m core.healthcheck
#
# The core owns the radio, the sound card and PTT, and keeps repeating with the API stopped. The
# API holds no device: it follows the core over the control socket and can be stopped, upgraded or
# crashed without the repeater noticing. Stop the moreopenrepeater service first: both it and the
# core would claim the same sound card and PTT line.
name: moreopenrepeater

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    image: moreopenrepeater-core:local
    restart: unless-stopped
    init: true               # reaps the Piper server and any other child it starts
    stop_grace_period: 30s   # time to unkey and close the devices
    user: "999:999"

    # Interim: host networking, because the link audio paths use loopback to a host
    # Asterisk (AudioSocket on 127.0.0.1:9092, USRP UDP). Once AllStar is its own
    # container (ADR 0005) the core can move to a private network.
    network_mode: host

    # Sound card and the CM108 PTT interface. A device must exist on the host or the
    # container will not start. The hidraw number can change between boots; a stable
    # udev name is planned (ADR 0005, host prerequisites).
    devices:
      - /dev/snd:/dev/snd
      - ${MOR_PTT_HIDRAW:-/dev/hidraw0}:${MOR_PTT_HIDRAW:-/dev/hidraw0}
    # audio is 29 on Debian and Pi OS. The gpio group number differs by system
    # (`getent group gpio`), so it is a number. dialout is for serial PTT.
    group_add:
      - audio
      - dialout
      - "${MOR_GPIO_GID:-986}"

    volumes:
      # state.json (the saved configuration) lives here. The core refuses to start
      # without it, so seed it first (docs/docker.md).
      - ${MOR_DATA_DIR:-./data}:/data
      # The control socket. The API container will mount the same volume.
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd

    environment:
      MOREOPENREPEATER_LOG_FORMAT: json  # see the api service
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock  # events also go to logd; if it is down they are dropped and counted
    env_file:
      - path: core.env
        required: false

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp filter makes the audio worker miss deadlines on a Pi:
      # the idle "audio glitch" pairs came every one to four minutes with it and
      # stopped without it (measured on a Pi 3B+, docs/docker.md, Measured on a Pi). A tight allowlist
      # profile for this container is the way to get the filter back without the cost.
      - seccomp=unconfined

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: moreopenrepeater-api:local
    restart: unless-stopped
    init: true
    user: "999:999"
    # The same interim host networking as the core: AllStar link control goes to Asterisk's
    # manager port on the host's loopback. The dashboard is on :8000 (MOREOPENREPEATER_PORT).
    network_mode: host
    # It starts without the core (it says "core not reachable") and follows it when it is up.
    depends_on:
      core:
        condition: service_started
    volumes:
      # The same data folder as the core: the API keeps its accounts, audio clips, history and
      # backups here; the core reads the audio clips and the one-time code secrets. The API never
      # writes state.json (the core owns the saved configuration).
      - ${MOR_DATA_DIR:-./data}:/data
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd
    environment:
      # One JSON event per line on stdout, which Docker's log driver keeps and rotates. The text log in
      # the data folder is unchanged, and the dashboard's Logs page still reads it.
      MOREOPENREPEATER_LOG_FORMAT: json
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock
      # Loopback by default. With no accounts set up the dashboard is open and can key the
      # transmitter, so it is not offered to the network until you choose to (MOR_API_HOST=0.0.0.0,
      # after creating an account or setting MOREOPENREPEATER_ADMIN_USER and _PASSWORD in api.env).
      MOREOPENREPEATER_HOST: ${MOR_API_HOST:-127.0.0.1}
      MOREOPENREPEATER_PORT: ${MOR_API_PORT:-8000}
    env_file:
      - path: api.env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The log collector (docs/docker.md, Logs). The core and the API send it events as datagrams on a Unix
  # socket in the logd-run volume; if it is down they drop them and count what they dropped, and nothing
  # else notices. It has no network at all, and only the two volumes are writable.
  logd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.logd
    image: moreopenrepeater-logd:local
    restart: unless-stopped
    init: true
    user: "999:999"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 128  # a share of an eighth of the default: the radio's processes come first
    environment:
      MOREOPENREPEATER_LOG_FORMAT: json
      # How much it keeps: MOREOPENREPEATER_LOGD_MAX_MB (64), MOREOPENREPEATER_LOGD_ROUTINE_DAYS (14) and
      # MOREOPENREPEATER_LOGD_CRITICAL_DAYS (30, for errors and worse).
    env_file:
      - path: logd.env
        required: false
    volumes:
      - logd-data:/var/lib/logd
      - logd-run:/run/logd
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  core-run:
  logd-run:
  logd-data:
