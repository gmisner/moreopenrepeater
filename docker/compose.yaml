# The core and the dashboard/API as two containers (docs/docker.md). Run from this folder:
#
#   cp .env.example .env              # host paths and devices (optional)
#   docker compose up -d --build
#   docker compose exec core python -m core.healthcheck
#
# The core owns the radio, the sound card and PTT, and keeps repeating with the API stopped. The
# API holds no device: it follows the core over the control socket and can be stopped, upgraded or
# crashed without the repeater noticing. Stop the moreopenrepeater service first: both it and the
# core would claim the same sound card and PTT line.
name: moreopenrepeater

# Where the core and the AllStar node find each other (docs/docker.md, The private network). Addresses, not names: Asterisk's
# USRP channel and its AudioSocket dialplan take an IP, and the core only accepts radio audio from the node's address.
# They must be inside MOR_SERVICES_SUBNET. Both services need the same values, since the API writes the node's
# configuration and the core listens.
x-link-addresses: &link_addresses
  MOREOPENREPEATER_USRP_LISTEN: 0.0.0.0:34001  # inside the container; nothing publishes it, and only the node's address is heard
  MOREOPENREPEATER_USRP_ADDRESS: ${MOR_CORE_IP:-172.28.0.10}  # what Asterisk is told to send the radio's audio to
  MOREOPENREPEATER_AUDIOSOCKET_LISTEN: 0.0.0.0:9092  # autopatch calls, when the node's AMI is set
  MOREOPENREPEATER_AUDIOSOCKET_ADDRESS: ${MOR_CORE_IP:-172.28.0.10}:9092
  MOREOPENREPEATER_DMR_USRP_LISTEN: 0.0.0.0:34011  # where the DMR bridge's audio is heard (the core), and the port the bridge is told to send to (the API)

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      args:
        WITH_PIPER: "0"  # Piper runs in its own container (the `piper` service); the core keeps only espeak-ng as the fallback
    image: moreopenrepeater-core:local
    restart: unless-stopped
    init: true               # reaps any child it starts
    stop_grace_period: 30s   # time to unkey and close the devices
    user: "999:999"

    # The private services network, not the host's: the AllStar node's container reaches the core here (USRP audio,
    # AudioSocket calls) and nothing on the host's network or loopback is involved. Nothing is published from the
    # core. To keep the old layout (a host Asterisk on the loopback) use compose.host-network.yaml.
    networks:
      services:
        ipv4_address: ${MOR_CORE_IP:-172.28.0.10}

    # Sound card and the CM108 PTT interface. A device must exist on the host or the
    # container will not start. The PTT device is found by a stable name that a udev rule makes
    # (docker/udev/61-moreopenrepeater-ptt.rules, installed once on the host), because the hidraw number
    # changes when the sound card drops off USB and comes back, and Docker looks the name up again
    # each time the core starts. MOR_PTT_HIDRAW in .env overrides it (a /dev/hidrawN path).
    devices:
      - /dev/snd:/dev/snd
      - ${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}:${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}
    # audio is 29 on Debian and Pi OS. The gpio group number differs by system
    # (`getent group gpio`), so it is a number. dialout is for serial PTT.
    group_add:
      - audio
      - dialout
      - "${MOR_GPIO_GID:-986}"

    volumes:
      # state.json (the saved configuration) lives here. The core refuses to start
      # without it, so seed it first (docs/docker.md).
      - ${MOR_DATA_DIR:-./data}:/data
      # The control socket. The API container will mount the same volume.
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd

    environment:
      MOREOPENREPEATER_LOG_FORMAT: json  # see the api service
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock  # events also go to logd; if it is down they are dropped and counted
      # Docker does not restart an unhealthy container, so a core whose audio stalls (the sound card dropped off USB
      # and came back, say) stops itself, with the transmitter off the air, and `restart` brings it back.
      MOREOPENREPEATER_EXIT_ON_STALL: "1"
      # The voice is the `piper` service's: the core asks it over the private network and does not start or hold a Piper
      # process. With it down the core carries on and speaks with espeak-ng until it is back. (The old layout in
      # compose.host-network.yaml puts Piper back inside the core.)
      PIPER_SERVICE_URL: http://piper:8766
      PIPER_SERVICE_EXTERNAL: "1"
      PIPER_DATA_DIR: ""
      <<: *link_addresses
      # The one PTT device the core is given, by the path it has inside the container. The default "auto"
      # would read the host's /dev/hidrawN numbers, which are not the container's.
      MOREOPENREPEATER_CM108_HIDRAW: ${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}
      # No second interface is given to the container, so there is no link radio's to find.
      MOREOPENREPEATER_LINK_CM108_HIDRAW: "off"
    env_file:
      - path: core.env
        required: false

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp filter makes the audio worker miss deadlines on a Pi:
      # the idle "audio glitch" pairs came every one to four minutes with it and
      # stopped without it (measured on a Pi 3B+, docs/docker.md, Measured on a Pi). A tight allowlist
      # profile for this container is the way to get the filter back without the cost.
      - seccomp=unconfined

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: moreopenrepeater-api:local
    restart: unless-stopped
    init: true
    user: "999:999"
    # The same private network as the core: AllStar link control goes to the node's manager port (AMI) as `allstar:5038`.
    # The dashboard is published on the host's loopback by default. With no accounts set up it is open and can key the
    # transmitter, so it is not offered to the network until you choose to (MOR_API_HOST=0.0.0.0, after creating an
    # account or setting MOREOPENREPEATER_AUTH_USER and MOREOPENREPEATER_AUTH_PASSWORD in api.env).
    networks:
      - services
    ports:
      - "${MOR_API_HOST:-127.0.0.1}:${MOR_API_PORT:-8000}:8000"
    # It starts without the core (it says "core not reachable") and follows it when it is up.
    depends_on:
      core:
        condition: service_started
    volumes:
      # The same data folder as the core: the API keeps its accounts, audio clips, history and
      # backups here; the core reads the audio clips and the one-time code secrets. The API never
      # writes state.json (the core owns the saved configuration).
      - ${MOR_DATA_DIR:-./data}:/data
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd
      # The AllStar node's and the DMR bridge's own files and the DMR restart request: what the dashboard's AllStar and DMR
      # pages edit. The services keep running without the API; these folders are empty until their containers start.
      - allstar-config:/etc/asterisk
      - dmr-config:/etc/moreopenrepeater/dmr
      - dmr-control:/dmr-control
    environment:
      # One JSON event per line on stdout, which Docker's log driver keeps and rotates. The text log in
      # the data folder is unchanged, and the dashboard's Logs page still reads it.
      MOREOPENREPEATER_LOG_FORMAT: json
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock
      MOREOPENREPEATER_LOGD_QUERY_SOCKET: /run/logd/query.sock  # the Logs page's history; without logd it says so
      MOREOPENREPEATER_ASTERISK_CONFIG_DIR: /etc/asterisk  # the AllStar node's configuration, edited by the AllStar page
      MOREOPENREPEATER_DMR_DIR: /etc/moreopenrepeater/dmr  # the DMR bridge's, edited by the DMR page
      MOREOPENREPEATER_DMR_RESTART_REQUEST: /dmr-control/request  # how the DMR page asks the bridge to restart
      MOREOPENREPEATER_DMR_STATUS: /dmr-control
      MOREOPENREPEATER_DMR_USRP_PEER: ${MOR_DMR_IP:-172.28.0.30}:34012  # the bridge, for the core to send audio to once the DMR page turns it on
      # Inside the container it listens on every address of its own network; what the host can reach is the
      # published port above (loopback by default).
      MOREOPENREPEATER_HOST: 0.0.0.0
      MOREOPENREPEATER_PORT: "8000"
      <<: *link_addresses
    env_file:
      - path: api.env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The log collector (docs/docker.md, Logs). The core and the API send it events as datagrams on a Unix
  # socket in the logd-run volume; if it is down they drop them and count what they dropped, and nothing
  # else notices. It has no network at all, and only the two volumes are writable.
  logd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.logd
    image: moreopenrepeater-logd:local
    restart: unless-stopped
    init: true
    user: "999:999"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 128  # a share of an eighth of the default: the radio's processes come first
    environment:
      MOREOPENREPEATER_LOG_FORMAT: json
      # How much it keeps: MOREOPENREPEATER_LOGD_MAX_MB (64), MOREOPENREPEATER_LOGD_ROUTINE_DAYS (14) and
      # MOREOPENREPEATER_LOGD_CRITICAL_DAYS (30, for errors and worse).
    env_file:
      - path: logd.env
        required: false
    volumes:
      - logd-data:/var/lib/logd
      - logd-run:/run/logd
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The text-to-speech voice: Piper's HTTP server in its own container, on by default (the core speaks with it, and falls back to
  # espeak-ng while it is not up, so nothing waits on it for long). It is not published: the core reaches it as `piper:8766`
  # on the private network. The default voice is in the image; others are downloaded into the `piper-voices` volume when the
  # dashboard picks one. Nothing here has a device or the host's network.
  piper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.piper
    image: moreopenrepeater-piper:local
    restart: unless-stopped
    init: true
    user: "999:999"
    networks:
      - services
    volumes:
      - piper-voices:/voices
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8766/info', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # a high-quality voice takes a while to load on a Pi
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The AllStarLink node (Asterisk with app_rpt, and EchoLink with it: chan_echolink is a module of the same process),
  # in its own container and off by default: `docker compose --profile allstar up -d allstar`. It needs nothing from
  # the host: no host Asterisk, no host config, no devices, no kernel modules, no host network. Its AMI is reachable
  # only on the private `services` network (never published), with a secret you set. Only IAX2 (4569/udp, how AllStarLink
  # nodes find each other) is published, and you may need to forward it on your router. Setup: docs/docker.md.
  allstar:
    profiles: ["allstar"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.allstar
    image: moreopenrepeater-allstar:local
    restart: unless-stopped
    init: true
    user: "999:999"
    stop_grace_period: 20s
    networks:
      services:
        ipv4_address: ${MOR_ALLSTAR_IP:-172.28.0.20}  # an address, not a name: it is what the radio's USRP audio is sent to
    ports:
      - "${MOR_ALLSTAR_IAX_PORT:-4569}:4569/udp"
    environment:
      MOR_AMI_PERMIT: ${MOR_SERVICES_SUBNET:-172.28.0.0/24}  # AMI answers only this network
    env_file:
      - path: allstar.env  # MOR_AMI_SECRET (required), MOR_AMI_USER
        required: false
    volumes:
      - allstar-config:/etc/asterisk  # the node's configuration, which the API edits for the dashboard's AllStar setup
      - allstar-data:/var/lib/asterisk  # what Asterisk keeps: its database of nodes and settings
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /run/asterisk:size=4m,mode=01777  # the control socket
      - /var/spool/asterisk:size=16m,mode=01777
      - /var/cache/asterisk:size=16m,mode=01777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 512
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The DMR bridge (DVSwitch's Analog_Bridge and MMDVM_Bridge, and md380-emu for the vocoder), in its own container and off
  # by default: `docker compose --profile dmr up -d dmr`. Its USRP audio goes to and from the core on the private network
  # (set MOREOPENREPEATER_DMR_USRP_LISTEN and _PEER in core.env, docs/docker.md). It needs nothing from the host and
  # publishes nothing: the DMR networks are reached by outbound connections.
  dmr:
    profiles: ["dmr"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dmr
    image: moreopenrepeater-dmr:local
    restart: unless-stopped
    init: true
    user: "999:999"
    stop_grace_period: 20s
    networks:
      services:
        ipv4_address: ${MOR_DMR_IP:-172.28.0.30}  # an address, not a name: the core only hears the bridge's audio from it
    environment:
      MOR_CORE_ADDRESS: ${MOR_CORE_IP:-172.28.0.10}  # where Analog_Bridge sends the audio, written into its .ini the first time
    volumes:
      - dmr-config:/etc/moreopenrepeater/dmr  # the .ini files, with the network password: the API edits them for the dashboard
      - dmr-control:/dmr-control  # the dashboard's restart request and the status it reads back
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=01777  # the programs' scratch space (and no log files)
      - /run/dmr:size=1m,mode=01777  # the supervisor's heartbeat
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 256  # a quarter of the default: the audio engine's processes come first
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The Winlink RMS gateway, in two containers and off by default: `docker compose --profile winlink up -d --build`
  # (docs/winlink.md, docs/adr/0006-winlink-rms-gateway.md). `direwolf` is the packet modem on its own radio and sound card,
  # `winlink` is the gateway (LinBPQ) that connects to Winlink and speaks KISS to the modem. Neither touches the repeater's
  # radio, sound card or PTT, and the core is not involved: a packet radio of its own is the design. Neither publishes a port.
  direwolf:
    profiles: ["winlink"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.direwolf
    image: moreopenrepeater-direwolf:local
    restart: unless-stopped
    init: true
    user: "999:999"
    networks:
      services:
        ipv4_address: ${MOR_DIREWOLF_IP:-172.28.0.40}  # an address, not a name: the gateway takes the modem's address as an IP
    # One sound card (its number from /proc/asound/cards on the host: MOR_PACKET_CARD in .env) and optionally one PTT
    # device, never /dev/snd as a whole: the repeater's own sound card is not in this container, so it cannot be opened.
    devices:
      - /dev/snd/controlC${MOR_PACKET_CARD:-9}:/dev/snd/controlC${MOR_PACKET_CARD:-9}
      - /dev/snd/pcmC${MOR_PACKET_CARD:-9}D0c:/dev/snd/pcmC${MOR_PACKET_CARD:-9}D0c
      - /dev/snd/pcmC${MOR_PACKET_CARD:-9}D0p:/dev/snd/pcmC${MOR_PACKET_CARD:-9}D0p
      - ${MOR_PACKET_PTT_HIDRAW:-/dev/null}:/dev/packet-ptt
    group_add:
      - audio
    env_file:
      - path: winlink.env
        required: false
    environment:
      MOR_PACKET_CARD: ${MOR_PACKET_CARD:-9}
    read_only: true
    tmpfs:
      - /run/direwolf:size=1m,mode=01777  # its configuration, made at every start
      - /tmp:size=4m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/direwolf-entrypoint.sh", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  winlink:
    profiles: ["winlink"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.winlink
    image: moreopenrepeater-winlink:local
    restart: unless-stopped
    init: true
    user: "999:999"
    networks:
      - services
    environment:
      MOR_WINLINK_KISS_HOST: ${MOR_DIREWOLF_IP:-172.28.0.40}  # winlink.env can name another modem (a hardware TNC)
    # No port is published: its admin page (8080) and telnet port (8010) answer on the private network only, and it reaches
    # Winlink by an outbound connection. The callsign, locator, passwords and the Winlink gateway password are in winlink.env.
    env_file:
      - path: winlink.env
        required: false
    read_only: true
    tmpfs:
      - /run/bpq:size=16m,mode=01777  # its configuration (it holds the passwords), its logs and what it keeps while running
      - /tmp:size=4m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/winlink-entrypoint.sh", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpu_shares: 256  # the repeater's processes come first
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Where the services talk to each other. Nothing is published from it except what a service names itself.
  services:
    driver: bridge
    ipam:
      config:
        - subnet: ${MOR_SERVICES_SUBNET:-172.28.0.0/24}

volumes:
  core-run:
  piper-voices:
  logd-run:
  logd-data:
  allstar-config:
  allstar-data:
  dmr-config:
  dmr-control:
