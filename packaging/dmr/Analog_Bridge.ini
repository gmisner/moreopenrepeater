; moreopenrepeater DMR bridge — Analog_Bridge (seeded by install-pi.sh --dmr)
include = dvsm.macro

[GENERAL]
logLevel = 2
exportMetadata = true
transferRootDir = /tmp
decoderFallBack = true
useEmulator = true
emulatorAddress = 127.0.0.1:2470

[AMBE_AUDIO]
address = 127.0.0.1
txPort = 31103
rxPort = 31100
ambeMode = DMR
minTxTimeMS = 2500
gatewayDmrId = 0
repeaterID = 0
txTg = 9
txTs = 2
colorCode = 1

[USRP]
address = 127.0.0.1
txPort = 34011
rxPort = 34012
usrpAudio = AUDIO_UNITY
tlvAudio = AUDIO_UNITY
