; rpt.conf
; Modeled on what the ASL3 Debian package installs, after "asl-menu" set up a node.
; The node number, password and callsign here are made up.

[general]

; The template every node in this file uses (the (!) means it is not a node itself).
[node-main](!)
; Shared settings
context = radio
callerid = "Fixture Repeater" <0000000000>
idrecording = |iN0CALL        ; CW ID, as asl-menu sets it
idtalkover = |iN0CALL
nodes = nodes
duplex = 1
linktolink = no
hangtime = 5000
althangtime = 10000
telemdefault = 1
controlstates = controlstates
macro = macro
functions = functions
statpost_program = /usr/bin/wget,-q,--timeout=15,--tries=1,--output-document=/dev/null
statpost_url = http://stats.allstarlink.org/uhandler

; The node: its radio is a USB sound card (SimpleUSB).
[99001](node-main)
rxchannel = SimpleUSB/usb_fixture      ; SimpleUSB
txchannel = SimpleUSB/usb_fixture
startup_macro = *81              ; run at startup
idtime = 600000
; the next line is a comment: password = not-this-one

[nodes]
99001 = radio@127.0.0.1/99001,NONE
99002 = radio@203.0.113.7:4569/99002,NONE    ; a friend's hub
99003 = radio@203.0.113.8/99003,NONE
99004 = radio@127.0.0.1/99004,NONE           ; a second node on this machine

[controlstates]
statenum = 0

[macro]
1 = *81

[functions]
1 = ilink,1

#tryinclude "custom/rpt/*.conf"
