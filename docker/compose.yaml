# The core and the dashboard/API as two containers (docs/docker.md). Run from this folder:
#
#   cp .env.example .env              # host paths and devices (optional)
#   docker compose up -d --build
#   docker compose exec core python -m core.healthcheck
#
# The core owns the radio, the sound card and PTT, and keeps repeating with the API stopped. The
# API holds no device: it follows the core over the control socket and can be stopped, upgraded or
# crashed without the repeater noticing. Stop the moreopenrepeater service first: both it and the
# core would claim the same sound card and PTT line.
name: moreopenrepeater

# Where the core and the AllStar node find each other (docs/docker.md, The private network). Addresses, not names: Asterisk's
# USRP channel and its AudioSocket dialplan take an IP, and the core only accepts radio audio from the node's address.
# They must be inside MOR_SERVICES_SUBNET. Both services need the same values, since the API writes the node's
# configuration and the core listens.
x-link-addresses: &link_addresses
  MOREOPENREPEATER_USRP_LISTEN: 0.0.0.0:34001  # inside the container; nothing publishes it, and only the node's address is heard
  MOREOPENREPEATER_USRP_ADDRESS: ${MOR_CORE_IP:-172.28.0.10}  # what Asterisk is told to send the radio's audio to
  MOREOPENREPEATER_AUDIOSOCKET_LISTEN: 0.0.0.0:9092  # autopatch calls, when the node's AMI is set
  MOREOPENREPEATER_AUDIOSOCKET_ADDRESS: ${MOR_CORE_IP:-172.28.0.10}:9092

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    image: moreopenrepeater-core:local
    restart: unless-stopped
    init: true               # reaps the Piper server and any other child it starts
    stop_grace_period: 30s   # time to unkey and close the devices
    user: "999:999"

    # The private services network, not the host's: the AllStar node's container reaches the core here (USRP audio,
    # AudioSocket calls) and nothing on the host's network or loopback is involved. Nothing is published from the
    # core. To keep the old layout (a host Asterisk on the loopback) use compose.host-network.yaml.
    networks:
      services:
        ipv4_address: ${MOR_CORE_IP:-172.28.0.10}

    # Sound card and the CM108 PTT interface. A device must exist on the host or the
    # container will not start. The PTT device is found by a stable name that a udev rule makes
    # (docker/udev/61-moreopenrepeater-ptt.rules, installed once on the host), because the hidraw number
    # changes when the sound card drops off USB and comes back, and Docker looks the name up again
    # each time the core starts. MOR_PTT_HIDRAW in .env overrides it (a /dev/hidrawN path).
    devices:
      - /dev/snd:/dev/snd
      - ${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}:${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}
    # audio is 29 on Debian and Pi OS. The gpio group number differs by system
    # (`getent group gpio`), so it is a number. dialout is for serial PTT.
    group_add:
      - audio
      - dialout
      - "${MOR_GPIO_GID:-986}"

    volumes:
      # state.json (the saved configuration) lives here. The core refuses to start
      # without it, so seed it first (docs/docker.md).
      - ${MOR_DATA_DIR:-./data}:/data
      # The control socket. The API container will mount the same volume.
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd

    environment:
      MOREOPENREPEATER_LOG_FORMAT: json  # see the api service
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock  # events also go to logd; if it is down they are dropped and counted
      # Docker does not restart an unhealthy container, so a core whose audio stalls (the sound card dropped off USB
      # and came back, say) stops itself, with the transmitter off the air, and `restart` brings it back.
      MOREOPENREPEATER_EXIT_ON_STALL: "1"
      <<: *link_addresses
      # The one PTT device the core is given, by the path it has inside the container. The default "auto"
      # would read the host's /dev/hidrawN numbers, which are not the container's.
      MOREOPENREPEATER_CM108_HIDRAW: ${MOR_PTT_HIDRAW:-/dev/moreopenrepeater-ptt}
      # No second interface is given to the container, so there is no link radio's to find.
      MOREOPENREPEATER_LINK_CM108_HIDRAW: "off"
    env_file:
      - path: core.env
        required: false

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp filter makes the audio worker miss deadlines on a Pi:
      # the idle "audio glitch" pairs came every one to four minutes with it and
      # stopped without it (measured on a Pi 3B+, docs/docker.md, Measured on a Pi). A tight allowlist
      # profile for this container is the way to get the filter back without the cost.
      - seccomp=unconfined

    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: moreopenrepeater-api:local
    restart: unless-stopped
    init: true
    user: "999:999"
    # The same private network as the core: AllStar link control goes to the node's manager port (AMI) as `allstar:5038`.
    # The dashboard is published on the host's loopback by default. With no accounts set up it is open and can key the
    # transmitter, so it is not offered to the network until you choose to (MOR_API_HOST=0.0.0.0, after creating an
    # account or setting MOREOPENREPEATER_AUTH_USER and MOREOPENREPEATER_AUTH_PASSWORD in api.env).
    networks:
      - services
    ports:
      - "${MOR_API_HOST:-127.0.0.1}:${MOR_API_PORT:-8000}:8000"
    # It starts without the core (it says "core not reachable") and follows it when it is up.
    depends_on:
      core:
        condition: service_started
    volumes:
      # The same data folder as the core: the API keeps its accounts, audio clips, history and
      # backups here; the core reads the audio clips and the one-time code secrets. The API never
      # writes state.json (the core owns the saved configuration).
      - ${MOR_DATA_DIR:-./data}:/data
      - core-run:/run/moreopenrepeater
      # Where logd's socket is. No depends_on anywhere: the core and the API do not need logd to start or to run.
      - logd-run:/run/logd
    environment:
      # One JSON event per line on stdout, which Docker's log driver keeps and rotates. The text log in
      # the data folder is unchanged, and the dashboard's Logs page still reads it.
      MOREOPENREPEATER_LOG_FORMAT: json
      MOREOPENREPEATER_LOGD_SOCKET: /run/logd/events.sock
      MOREOPENREPEATER_LOGD_QUERY_SOCKET: /run/logd/query.sock  # the Logs page's history; without logd it says so
      # Inside the container it listens on every address of its own network; what the host can reach is the
      # published port above (loopback by default).
      MOREOPENREPEATER_HOST: 0.0.0.0
      MOREOPENREPEATER_PORT: "8000"
      <<: *link_addresses
    env_file:
      - path: api.env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The log collector (docs/docker.md, Logs). The core and the API send it events as datagrams on a Unix
  # socket in the logd-run volume; if it is down they drop them and count what they dropped, and nothing
  # else notices. It has no network at all, and only the two volumes are writable.
  logd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.logd
    image: moreopenrepeater-logd:local
    restart: unless-stopped
    init: true
    user: "999:999"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 128  # a share of an eighth of the default: the radio's processes come first
    environment:
      MOREOPENREPEATER_LOG_FORMAT: json
      # How much it keeps: MOREOPENREPEATER_LOGD_MAX_MB (64), MOREOPENREPEATER_LOGD_ROUTINE_DAYS (14) and
      # MOREOPENREPEATER_LOGD_CRITICAL_DAYS (30, for errors and worse).
    env_file:
      - path: logd.env
        required: false
    volumes:
      - logd-data:/var/lib/logd
      - logd-run:/run/logd
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # The AllStarLink node (Asterisk with app_rpt, and EchoLink with it: chan_echolink is a module of the same process),
  # in its own container and off by default: `docker compose --profile allstar up -d allstar`. It needs nothing from
  # the host: no host Asterisk, no host config, no devices, no kernel modules, no host network. Its AMI is reachable
  # only on the private `services` network (never published), with a secret you set. Only IAX2 (4569/udp, how AllStarLink
  # nodes find each other) is published, and you may need to forward it on your router. Setup: docs/docker.md.
  allstar:
    profiles: ["allstar"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.allstar
    image: moreopenrepeater-allstar:local
    restart: unless-stopped
    init: true
    user: "999:999"
    stop_grace_period: 20s
    networks:
      services:
        ipv4_address: ${MOR_ALLSTAR_IP:-172.28.0.20}  # an address, not a name: it is what the radio's USRP audio is sent to
    ports:
      - "${MOR_ALLSTAR_IAX_PORT:-4569}:4569/udp"
    environment:
      MOR_AMI_PERMIT: ${MOR_SERVICES_SUBNET:-172.28.0.0/24}  # AMI answers only this network
    env_file:
      - path: allstar.env  # MOR_AMI_SECRET (required), MOR_AMI_USER
        required: false
    volumes:
      - allstar-config:/etc/asterisk  # the node's configuration, which the API edits for the dashboard's AllStar setup
      - allstar-data:/var/lib/asterisk  # what Asterisk keeps: its database of nodes and settings
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /run/asterisk:size=4m,mode=01777  # the control socket
      - /var/spool/asterisk:size=16m,mode=01777
      - /var/cache/asterisk:size=16m,mode=01777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpu_shares: 512
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Where the services talk to each other. Nothing is published from it except what a service names itself.
  services:
    driver: bridge
    ipam:
      config:
        - subnet: ${MOR_SERVICES_SUBNET:-172.28.0.0/24}

volumes:
  core-run:
  logd-run:
  logd-data:
  allstar-config:
  allstar-data:
